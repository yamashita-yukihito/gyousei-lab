<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="t d">
  <title id="t">無権代理人の責任が生じるかどうかの早見表</title>
  <desc id="d">相手方が善意無過失なら、無権代理人が善意でも悪意でも責任を負う。相手方が善意だが過失があるときは、無権代理人が悪意なら責任を負い、善意なら負わない。相手方が悪意なら、無権代理人が善意でも悪意でも責任を負わない。</desc>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; fill: #1d2a26; }
    .h { font-size: 22px; font-weight: 800; fill: #183a34; }
    .sub { font-size: 14px; fill: #55635d; }
    .th { font-size: 15px; font-weight: 800; fill: #183a34; }
    .ths { font-size: 12px; fill: #55635d; }
    .row { font-size: 16px; font-weight: 800; }
    .ok { font-size: 26px; font-weight: 800; fill: #ffffff; }
    .oks { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="640" height="470" fill="#ffffff"/>
  <text class="h" x="320" y="34" text-anchor="middle">無権代理人の責任（117条）は、まず相手方を見る</text>
  <text class="sub" x="320" y="58" text-anchor="middle">無権代理人の善意・悪意が効くのは、相手方に過失があるときだけ</text>

  <text class="th" x="370" y="100" text-anchor="middle">無権代理人が善意</text>
  <text class="ths" x="370" y="118" text-anchor="middle">権限が無いと知らなかった</text>
  <text class="th" x="530" y="100" text-anchor="middle">無権代理人が悪意</text>
  <text class="ths" x="530" y="118" text-anchor="middle">分かっていて代理した</text>

  <text class="row" x="24" y="166">相手方が善意無過失</text>
  <rect x="300" y="134" width="140" height="64" rx="8" fill="#2f5d8a"/>
  <text class="ok" x="370" y="168" text-anchor="middle">責任あり</text>
  <text class="oks" x="370" y="188" text-anchor="middle">無過失責任（1項）</text>
  <rect x="460" y="134" width="140" height="64" rx="8" fill="#2f5d8a"/>
  <text class="ok" x="530" y="176" text-anchor="middle">責任あり</text>

  <text class="row" x="24" y="246">相手方が善意・過失あり</text>
  <rect x="300" y="214" width="140" height="64" rx="8" fill="#8a2f3f"/>
  <text class="ok" x="370" y="248" text-anchor="middle">責任なし</text>
  <text class="oks" x="370" y="268" text-anchor="middle">2項2号</text>
  <rect x="460" y="214" width="140" height="64" rx="8" fill="#2f5d8a"/>
  <text class="ok" x="530" y="248" text-anchor="middle">責任あり</text>
  <text class="oks" x="530" y="268" text-anchor="middle">2項2号ただし書</text>

  <text class="row" x="24" y="326">相手方が悪意</text>
  <rect x="300" y="294" width="140" height="64" rx="8" fill="#8a2f3f"/>
  <text class="ok" x="370" y="328" text-anchor="middle">責任なし</text>
  <text class="oks" x="370" y="348" text-anchor="middle">2項1号</text>
  <rect x="460" y="294" width="140" height="64" rx="8" fill="#8a2f3f"/>
  <text class="ok" x="530" y="336" text-anchor="middle">責任なし</text>

  <rect x="20" y="380" width="600" height="70" rx="8" fill="#f3f6f5"/>
  <text class="note" x="320" y="408" text-anchor="middle">「責任なし」の欄は、減額ではなくゼロ（117条はオール・オア・ナッシング）</text>
  <text class="note" x="320" y="432" text-anchor="middle">減額で調整したいなら、別ルートの不法行為（709条）＋過失相殺</text>
</svg>
