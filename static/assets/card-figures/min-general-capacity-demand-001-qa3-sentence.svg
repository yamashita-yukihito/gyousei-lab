<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" role="img" aria-labelledby="t d">
  <title id="t">長い肢は「誰に聞いたか」だけ見る</title>
  <desc id="d">令和7年問27肢5を、誰が、いつ、誰に、何について、どう聞いたか、結果の6つに分けた図。判定の鍵は宛先で、法定代理人・保佐人・補助人という一人で追認を決められる人に聞いて黙っていれば追認とみなされる。宛先を被保佐人本人に入れ替えると、黙っていれば取消しとみなされる。</desc>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; fill: #1d2a26; }
    .h { font-size: 22px; font-weight: 800; fill: #183a34; }
    .sub { font-size: 14px; fill: #55635d; }
    .lab { font-size: 15px; font-weight: 800; fill: #ffffff; }
    .m { font-size: 15px; font-weight: 700; }
    .n { font-size: 12px; fill: #55635d; }
    .bh { font-size: 16px; font-weight: 800; }
    .bs { font-size: 13px; fill: #55635d; }
    .big { font-size: 22px; font-weight: 800; }
    .note { font-size: 15px; font-weight: 700; }
  </style>
  <rect width="640" height="690" fill="#ffffff"/>
  <text class="h" x="320" y="36" text-anchor="middle">長い肢は「誰に聞いたか」だけ見る</text>
  <text class="sub" x="320" y="60" text-anchor="middle">令和7年問27肢5（○）を6つに切る</text>

  <!-- 1 誰が -->
  <rect x="16" y="80" width="608" height="52" rx="8" fill="#f7f8f7" stroke="#d6dfdb"/>
  <rect x="16" y="80" width="84" height="52" rx="8" fill="#7a8781"/>
  <text class="lab" x="58" y="111" text-anchor="middle">誰が</text>
  <text class="m" x="112" y="111">制限行為能力者の相手方が</text>
  <text class="n" x="612" y="111" text-anchor="end">中古車店の店長</text>

  <!-- 2 いつ -->
  <rect x="16" y="138" width="608" height="52" rx="8" fill="#f7f8f7" stroke="#d6dfdb"/>
  <rect x="16" y="138" width="84" height="52" rx="8" fill="#7a8781"/>
  <text class="lab" x="58" y="169" text-anchor="middle">いつ</text>
  <text class="m" x="112" y="169">本人が行為能力者とならない間に</text>
  <text class="n" x="612" y="169" text-anchor="end">ケン君がまだ17歳</text>

  <!-- 3 誰に（鍵） -->
  <rect x="16" y="196" width="608" height="52" rx="8" fill="#fff8e6" stroke="#e2a93b" stroke-width="2.5"/>
  <rect x="16" y="196" width="84" height="52" rx="8" fill="#c98a12"/>
  <text class="lab" x="58" y="227" text-anchor="middle">誰に★</text>
  <text class="m" x="112" y="227">法定代理人・保佐人・補助人に</text>
  <text class="n" x="612" y="227" text-anchor="end" style="font-weight:700;fill:#8a5a00">一人で決められる大人</text>

  <!-- 4 何を -->
  <rect x="16" y="254" width="608" height="52" rx="8" fill="#f7f8f7" stroke="#d6dfdb"/>
  <rect x="16" y="254" width="84" height="52" rx="8" fill="#7a8781"/>
  <text class="lab" x="58" y="285" text-anchor="middle">何を</text>
  <text class="m" x="112" y="285">その権限内の行為について</text>
  <text class="n" x="612" y="285" text-anchor="end">その人が追認できる範囲</text>

  <!-- 5 どう -->
  <rect x="16" y="312" width="608" height="52" rx="8" fill="#f7f8f7" stroke="#d6dfdb"/>
  <rect x="16" y="312" width="84" height="52" rx="8" fill="#7a8781"/>
  <text class="lab" x="58" y="343" text-anchor="middle">どう</text>
  <text class="m" x="112" y="343">1か月以上の期間で、追認するか催告</text>
  <text class="n" x="612" y="343" text-anchor="end">「認めますか？」</text>

  <!-- 6 結果 -->
  <rect x="16" y="370" width="608" height="52" rx="8" fill="#eef6f1" stroke="#9fc9b0"/>
  <rect x="16" y="370" width="84" height="52" rx="8" fill="#2f7d55"/>
  <text class="lab" x="58" y="401" text-anchor="middle">結果</text>
  <text class="m" x="112" y="401">確答を発しない → 追認とみなす</text>
  <text class="n" x="612" y="401" text-anchor="end">黙った＝文句なし</text>

  <!-- 宛先の入れ替え -->
  <text class="note" x="320" y="456" text-anchor="middle">★の宛先を入れ替えると、結論が逆になる</text>

  <rect x="16" y="470" width="296" height="128" rx="12" fill="#eef6f1" stroke="#2f7d55" stroke-width="2"/>
  <text class="bh" x="164" y="498" text-anchor="middle">宛先＝保護者</text>
  <text class="bs" x="164" y="520" text-anchor="middle">一人で追認を決められる</text>
  <text class="big" x="164" y="556" text-anchor="middle" style="fill:#2f7d55">黙ったら 追認</text>
  <text class="bs" x="164" y="584" text-anchor="middle">20条2項・この肢は○</text>

  <rect x="328" y="470" width="296" height="128" rx="12" fill="#fdf1ef" stroke="#b23a2e" stroke-width="2"/>
  <text class="bh" x="476" y="498" text-anchor="middle">宛先＝被保佐人の本人</text>
  <text class="bs" x="476" y="520" text-anchor="middle">「保佐人のOKをもらってきて」</text>
  <text class="big" x="476" y="556" text-anchor="middle" style="fill:#b23a2e">黙ったら 取消し</text>
  <text class="bs" x="476" y="584" text-anchor="middle">20条4項・カードのAは×</text>

  <!-- まとめ -->
  <rect x="16" y="612" width="608" height="64" rx="12" fill="#fff8e6" stroke="#e2c27a" stroke-width="2"/>
  <text class="note" x="320" y="640" text-anchor="middle">「追認とみなす」を見たら、宛先が保護者かを確かめる</text>
  <text class="bs" x="320" y="663" text-anchor="middle">未成年者・成年被後見人の本人に聞いても、催告の効果はない</text>
</svg>
