<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d">
  <title id="t">連帯債務者の一人に起きたことは、ほかの連帯債務者にも効くか</title>
  <desc id="d">上：売主DがAだけに請求すると、Aの時効だけが止まり、BとCの時効は進む。下の表：ほかの連帯債務者にも効くのは、弁済・代物弁済、更改、相殺、混同の4つで、債権者が満足したか債権が消えた場合。効かないのは、請求、免除、時効の完成、承認で、言われた本人だけの話。保証も同じで、連帯保証人への請求は主たる債務者に効かない。</desc>
  <defs>
    <marker id="qa1-joint-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b23a2e"/></marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; fill: #1d2a26; }
    .h { font-size: 19px; font-weight: 800; fill: #183a34; }
    .b { font-size: 15px; font-weight: 800; fill: #183a34; }
    .t { font-size: 14px; }
    .s { font-size: 12px; fill: #4b5a55; }
    .ok { font-size: 14px; font-weight: 800; fill: #1f6b45; }
    .ng { font-size: 14px; font-weight: 800; fill: #b23a2e; }
  </style>
  <rect width="640" height="500" fill="#fbfaf6"/>
  <text x="320" y="30" text-anchor="middle" class="h">連帯債務：請求は「言われた本人だけ」</text>

  <rect x="30" y="56" width="120" height="50" rx="8" fill="#fff" stroke="#8a5a1f" stroke-width="2"/>
  <text x="90" y="86" text-anchor="middle" class="b">売主D</text>
  <rect x="250" y="56" width="110" height="50" rx="8" fill="#fff" stroke="#2c5f8a" stroke-width="2"/>
  <text x="305" y="80" text-anchor="middle" class="b">A</text>
  <text x="305" y="98" text-anchor="middle" class="s">時効が止まる</text>
  <rect x="380" y="56" width="110" height="50" rx="8" fill="#fff" stroke="#9aa5a1" stroke-width="2"/>
  <text x="435" y="80" text-anchor="middle" class="b">B</text>
  <text x="435" y="98" text-anchor="middle" class="s">時効は進む</text>
  <rect x="510" y="56" width="110" height="50" rx="8" fill="#fff" stroke="#9aa5a1" stroke-width="2"/>
  <text x="565" y="80" text-anchor="middle" class="b">C</text>
  <text x="565" y="98" text-anchor="middle" class="s">時効は進む</text>
  <line x1="152" y1="81" x2="244" y2="81" stroke="#b23a2e" stroke-width="2" marker-end="url(#qa1-joint-arrow)"/>
  <text x="198" y="72" text-anchor="middle" class="ng">請求</text>
  <text x="320" y="134" text-anchor="middle" class="t">3人で300万円の連帯債務。DがAだけに請求しても、BとCには効かない（441条）。</text>

  <rect x="20" y="154" width="600" height="330" rx="10" fill="#fff" stroke="#c9c2b0"/>
  <text x="40" y="184" class="ok">ほかの人にも効く（絶対効）</text>
  <text x="340" y="184" class="ng">言われた本人だけ（相対効）</text>
  <line x1="20" y1="196" x2="620" y2="196" stroke="#c9c2b0"/>
  <line x1="320" y1="196" x2="320" y2="380" stroke="#e4dfd2"/>
  <text x="40" y="224" class="t">・弁済・代物弁済</text>
  <text x="40" y="250" class="t">・更改（438条）</text>
  <text x="40" y="276" class="t">・相殺（439条1項）</text>
  <text x="40" y="302" class="t">・混同（440条）</text>
  <text x="40" y="336" class="s">債権者がもう満足した、または</text>
  <text x="40" y="354" class="s">債権そのものが消えた・変わった</text>
  <text x="340" y="224" class="t">・履行の請求</text>
  <text x="340" y="250" class="t">・免除</text>
  <text x="340" y="276" class="t">・時効の完成</text>
  <text x="340" y="302" class="t">・承認 など</text>
  <text x="340" y="336" class="s">債権者はまだお金を受け取っていない</text>
  <text x="340" y="354" class="s">→ ほかの人の知らないところで動かさない</text>
  <line x1="20" y1="380" x2="620" y2="380" stroke="#c9c2b0"/>
  <text x="40" y="408" class="b">例外と比較</text>
  <text x="40" y="432" class="t">・債権者とほかの連帯債務者が合意していれば、その合意に従う（441条ただし書）</text>
  <text x="40" y="454" class="t">・連帯保証人への請求も、主たる債務者に効かない（458条→441条）</text>
  <text x="40" y="476" class="s">　※ 2020年3月までは請求も絶対効だった。平成の過去問は答えが逆になる。</text>
</svg>
