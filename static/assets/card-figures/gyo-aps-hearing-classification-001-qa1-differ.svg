<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 652" role="img" aria-labelledby="t d">
  <title id="t">聴聞と弁明の機会の付与の違い</title>
  <desc id="d">聴聞は主宰者が仕切る期日で口頭により行い、参加人、補佐人、資料の閲覧、職員への質問、調書と報告書、再開の規定がある。弁明は書面が原則で、行政庁が認めたときだけ口頭になり、これらの規定がない。</desc>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; fill: #1d2a26; }
    .h { font-size: 21px; font-weight: 800; fill: #183a34; }
    .sub { font-size: 13px; fill: #55635d; }
    .th { font-size: 16px; font-weight: 800; fill: #ffffff; }
    .lab { font-size: 13px; font-weight: 800; fill: #183a34; }
    .c { font-size: 13px; }
    .no { font-size: 13px; fill: #8a2f3f; font-weight: 700; }
  </style>
  <rect width="640" height="652" fill="#ffffff"/>
  <text class="h" x="320" y="32" text-anchor="middle">聴聞と弁明で違うところ</text>
  <rect x="16" y="46" width="126" height="28" fill="#2f6b4f"/><text class="th" x="24" y="66">項目</text><rect x="142" y="46" width="241" height="28" fill="#2f6b4f"/><text class="th" x="150" y="66">聴聞</text><rect x="383" y="46" width="241" height="28" fill="#2f6b4f"/><text class="th" x="391" y="66">弁明の機会の付与</text>
  <rect x="16" y="74" width="608" height="51" fill="#f4f8f6"/><text class="lab" x="24" y="94">対象の処分</text><text class="c" x="150" y="94">取消し・はく奪・解任・除名など</text><text class="c" x="150" y="113">（13条1項1号）</text><text class="c" x="391" y="94">聴聞に当たらない残り</text><text class="c" x="391" y="113">営業停止・改善命令など（同項2号）</text><line x1="16" y1="125" x2="624" y2="125" stroke="#cfdcd6"/><text class="lab" x="24" y="145">進め方</text><text class="c" x="150" y="145">期日に出頭して、口頭で（20条）</text><text class="c" x="391" y="145">書面が原則。口頭は行政庁が</text><text class="c" x="391" y="164">認めたときだけ（29条1項）</text><line x1="16" y1="176" x2="624" y2="176" stroke="#cfdcd6"/><rect x="16" y="176" width="608" height="32" fill="#f4f8f6"/><text class="lab" x="24" y="196">仕切る人</text><text class="c" x="150" y="196">主宰者（19条）</text><text class="no" x="391" y="196">✕ 主宰者はいない</text><line x1="16" y1="208" x2="624" y2="208" stroke="#cfdcd6"/><text class="lab" x="24" y="228">公開</text><text class="c" x="150" y="228">非公開が原則（20条6項）</text><text class="no" x="391" y="228">✕ 規定なし</text><line x1="16" y1="240" x2="624" y2="240" stroke="#cfdcd6"/><rect x="16" y="240" width="608" height="51" fill="#f4f8f6"/><text class="lab" x="24" y="260">通知に書くこと</text><text class="c" x="150" y="260">期日と場所（15条1項）、閲覧など</text><text class="c" x="150" y="279">ができることの教示（15条2項）</text><text class="c" x="391" y="260">弁明書の提出先と提出期限</text><text class="c" x="391" y="279">（30条。教示の規定なし）</text><line x1="16" y1="291" x2="624" y2="291" stroke="#cfdcd6"/><text class="lab" x="24" y="311">参加人</text><text class="c" x="150" y="311">○ 主宰者が求め・許可（17条）</text><text class="no" x="391" y="311">✕ 規定なし</text><line x1="16" y1="323" x2="624" y2="323" stroke="#cfdcd6"/><rect x="16" y="323" width="608" height="32" fill="#f4f8f6"/><text class="lab" x="24" y="343">補佐人</text><text class="c" x="150" y="343">○ 主宰者の許可で同行（20条3項）</text><text class="no" x="391" y="343">✕ 規定なし</text><line x1="16" y1="355" x2="624" y2="355" stroke="#cfdcd6"/><text class="lab" x="24" y="375">資料の閲覧</text><text class="c" x="150" y="375">○ 通知から終結まで（18条）</text><text class="no" x="391" y="375">✕ 規定なし</text><line x1="16" y1="387" x2="624" y2="387" stroke="#cfdcd6"/><rect x="16" y="387" width="608" height="32" fill="#f4f8f6"/><text class="lab" x="24" y="407">職員への質問</text><text class="c" x="150" y="407">○ 主宰者の許可で（20条2項）</text><text class="no" x="391" y="407">✕ 規定なし</text><line x1="16" y1="419" x2="624" y2="419" stroke="#cfdcd6"/><text class="lab" x="24" y="439">欠席したとき</text><text class="c" x="150" y="439">正当な理由なく欠席し陳述書もなし</text><text class="c" x="150" y="458">→ 終結できる（23条1項）</text><text class="no" x="391" y="439">✕ 規定なし</text><line x1="16" y1="470" x2="624" y2="470" stroke="#cfdcd6"/><rect x="16" y="470" width="608" height="32" fill="#f4f8f6"/><text class="lab" x="24" y="490">調書・報告書</text><text class="c" x="150" y="490">○ 主宰者が作る（24条）</text><text class="no" x="391" y="490">✕ 作らない</text><line x1="16" y1="502" x2="624" y2="502" stroke="#cfdcd6"/><text class="lab" x="24" y="522">再開</text><text class="c" x="150" y="522">○ 終結後の事情で命じられる</text><text class="c" x="150" y="541">（25条）</text><text class="no" x="391" y="522">✕ 再提出を求める規定なし</text><line x1="16" y1="553" x2="624" y2="553" stroke="#cfdcd6"/><rect x="16" y="553" width="608" height="32" fill="#f4f8f6"/><text class="lab" x="24" y="573">処分の決定</text><text class="c" x="150" y="573">調書と報告書を十分に参酌（26条）</text><text class="no" x="391" y="573">✕ 参酌の規定なし</text><line x1="16" y1="585" x2="624" y2="585" stroke="#cfdcd6"/><text class="lab" x="24" y="605">手続の途中の</text><text class="lab" x="24" y="624">処分への審査請求</text><text class="no" x="150" y="605">✕ できない（27条）</text><text class="c" x="391" y="605">途中の処分がない</text><line x1="16" y1="636" x2="624" y2="636" stroke="#cfdcd6"/><line x1="142" y1="46" x2="142" y2="636" stroke="#cfdcd6"/><line x1="383" y1="46" x2="383" y2="636" stroke="#cfdcd6"/>
</svg>
