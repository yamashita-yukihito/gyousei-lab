<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="t d">
  <title id="t">憲法26条の中で、誰が権利を持ち、誰が義務を負うか</title>
  <desc id="d">子どもは26条1項の教育を受ける権利を持つ。親は26条2項前段の普通教育を受けさせる義務を負い、これが三大義務のひとつ。国は26条2項後段により授業料を取らず、教育内容は必要かつ相当な範囲で決められる。下の表：三大義務は教育を受けさせる義務（26条2項）、勤労の義務（27条1項）、納税の義務（30条）。</desc>
  <defs>
    <marker id="qa1-edu-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f6b45"/></marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; fill: #1d2a26; }
    .h { font-size: 20px; font-weight: 800; fill: #183a34; }
    .box { font-size: 18px; font-weight: 800; fill: #183a34; }
    .t { font-size: 14px; }
    .a { font-size: 13px; font-weight: 800; fill: #1f6b45; }
    .duty { font-size: 14px; font-weight: 800; fill: #b23a2e; }
  </style>
  <rect width="640" height="470" fill="#fbfaf6"/>
  <text x="320" y="32" text-anchor="middle" class="h">憲法26条：権利は子、義務は親、タダにするのは国</text>

  <rect x="24" y="62" width="180" height="96" rx="10" fill="#fff" stroke="#b23a2e" stroke-width="2"/>
  <text x="114" y="92" text-anchor="middle" class="box">親（保護者）</text>
  <text x="114" y="118" text-anchor="middle" class="duty">受けさせる義務</text>
  <text x="114" y="140" text-anchor="middle" class="t">26条2項前段＝三大義務</text>

  <rect x="436" y="62" width="180" height="96" rx="10" fill="#fff" stroke="#2c5f8a" stroke-width="2"/>
  <text x="526" y="92" text-anchor="middle" class="box">子ども</text>
  <text x="526" y="118" text-anchor="middle" class="t" font-weight="800">教育を受ける権利</text>
  <text x="526" y="140" text-anchor="middle" class="t">26条1項（学習権）</text>

  <rect x="230" y="210" width="180" height="96" rx="10" fill="#fff" stroke="#1f6b45" stroke-width="2"/>
  <text x="320" y="240" text-anchor="middle" class="box">国</text>
  <text x="320" y="266" text-anchor="middle" class="t">無償＝授業料を取らない</text>
  <text x="320" y="288" text-anchor="middle" class="t">26条2項後段</text>

  <line x1="206" y1="100" x2="430" y2="100" stroke="#1f6b45" stroke-width="2" marker-end="url(#qa1-edu-arrow)"/>
  <text x="318" y="90" text-anchor="middle" class="a">学校へ行かせる</text>
  <line x1="410" y1="232" x2="480" y2="164" stroke="#1f6b45" stroke-width="2" marker-end="url(#qa1-edu-arrow)"/>
  <text x="452" y="226" class="a">中身を決める</text>
  <text x="452" y="244" class="a">（必要かつ相当まで）</text>
  <text x="38" y="226" class="t">このカードの本題は、</text>
  <text x="38" y="246" class="t">国の「中身を決める」矢印</text>
  <text x="38" y="266" class="t">（旭川学テ事件）</text>

  <rect x="24" y="330" width="592" height="122" rx="10" fill="#fff" stroke="#c9c2b0"/>
  <text x="40" y="358" class="box">三大義務（国民が負う義務）</text>
  <text x="40" y="386" class="t">① 子どもに普通教育を受けさせる義務 …… 26条2項（このカードと同じ条文）</text>
  <text x="40" y="410" class="t">② 勤労の義務 …… 27条1項（勤労の「権利」と同じ項）</text>
  <text x="40" y="434" class="t">③ 納税の義務 …… 30条</text>
</svg>
