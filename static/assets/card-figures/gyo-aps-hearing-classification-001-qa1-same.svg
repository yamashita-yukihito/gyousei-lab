<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 542" role="img" aria-labelledby="t d">
  <title id="t">聴聞と弁明の機会の付与で同じところ</title>
  <desc id="d">代理人の選任、証拠の提出、書面の通知、緊急時の省略、理由の提示、申請の拒否で手続を執らないこと、処分そのものへの審査請求は、聴聞も弁明も同じである。</desc>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; fill: #1d2a26; }
    .h { font-size: 21px; font-weight: 800; fill: #183a34; }
    .sub { font-size: 13px; fill: #55635d; }
    .th { font-size: 16px; font-weight: 800; fill: #ffffff; }
    .lab { font-size: 13px; font-weight: 800; fill: #183a34; }
    .c { font-size: 13px; }
    .no { font-size: 13px; fill: #8a2f3f; font-weight: 700; }
  </style>
  <rect width="640" height="542" fill="#ffffff"/>
  <text class="h" x="320" y="32" text-anchor="middle">聴聞と弁明で同じところ</text>
  <rect x="16" y="46" width="126" height="28" fill="#2f6b4f"/><text class="th" x="24" y="66">項目</text><rect x="142" y="46" width="226" height="28" fill="#2f6b4f"/><text class="th" x="150" y="66">聴聞も弁明も</text><rect x="368" y="46" width="256" height="28" fill="#2f6b4f"/><text class="th" x="376" y="66">ひっかけ（×の形）</text>
  <rect x="16" y="74" width="608" height="51" fill="#f4f8f6"/><text class="lab" x="24" y="94">代理人</text><text class="c" x="150" y="94">○ 選任できる</text><text class="c" x="150" y="113">（16条、弁明は31条で準用）</text><text class="c" x="376" y="94">弁明は本人だけ、という形に注意</text><line x1="16" y1="125" x2="624" y2="125" stroke="#cfdcd6"/><text class="lab" x="24" y="145">自分の証拠</text><text class="c" x="150" y="145">○ 出せる</text><text class="c" x="150" y="164">（20条2項・21条、29条2項）</text><text class="c" x="376" y="145">弁明は言い分だけ、という形に注意</text><line x1="16" y1="176" x2="624" y2="176" stroke="#cfdcd6"/><rect x="16" y="176" width="608" height="70" fill="#f4f8f6"/><text class="lab" x="24" y="196">通知</text><text class="c" x="150" y="196">処分の内容・根拠法令・原因事実</text><text class="c" x="150" y="215">を書面で（15条1項、30条）</text><text class="c" x="376" y="196">聴聞を公正にできないなら原因事実を</text><text class="c" x="376" y="215">通知しなくてよい</text><text class="c" x="376" y="234">（平成25年問11肢2）</text><line x1="16" y1="246" x2="624" y2="246" stroke="#cfdcd6"/><text class="lab" x="24" y="266">手続の省略</text><text class="c" x="150" y="266">緊急の場合などは、どちらも</text><text class="c" x="150" y="285">省略できる（13条2項）</text><text class="c" x="376" y="266">緊急なら弁明に換える</text><text class="c" x="376" y="285">（平成26年問25肢2）</text><text class="c" x="376" y="304">処分の後で手続を執る</text><text class="c" x="376" y="323">（平成25年問11肢5）</text><line x1="16" y1="335" x2="624" y2="335" stroke="#cfdcd6"/><rect x="16" y="335" width="608" height="51" fill="#f4f8f6"/><text class="lab" x="24" y="355">理由の提示</text><text class="c" x="150" y="355">処分と同時に示す（14条1項）</text><text class="c" x="150" y="374">差し迫った必要があれば後で</text><text class="c" x="376" y="355">聴聞だけに付く、という形に注意</text><line x1="16" y1="386" x2="624" y2="386" stroke="#cfdcd6"/><text class="lab" x="24" y="406">申請の拒否</text><text class="c" x="150" y="406">どちらも執らない</text><text class="c" x="150" y="425">（2条4号ロ）</text><text class="c" x="376" y="406">拒否には弁明が要る</text><text class="c" x="376" y="425">（平成30年問11肢3、令和2年問13ウ、</text><text class="c" x="376" y="444">令和7年問13肢4）</text><line x1="16" y1="456" x2="624" y2="456" stroke="#cfdcd6"/><rect x="16" y="456" width="608" height="70" fill="#f4f8f6"/><text class="lab" x="24" y="476">処分そのものへ</text><text class="lab" x="24" y="495">の審査請求</text><text class="c" x="150" y="476">どちらもできる</text><text class="c" x="150" y="495">（27条は途中の処分だけ）</text><text class="c" x="376" y="476">聴聞を経るとできない</text><text class="c" x="376" y="495">（平成18年問11肢4、</text><text class="c" x="376" y="514">平成19年問11肢5）</text><line x1="16" y1="526" x2="624" y2="526" stroke="#cfdcd6"/><line x1="142" y1="46" x2="142" y2="526" stroke="#cfdcd6"/><line x1="368" y1="46" x2="368" y2="526" stroke="#cfdcd6"/>
</svg>
